<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Render Car Shipping PNG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 800px;
      overflow: hidden;
      font-family: 'Outfit', 'Inter', system-ui, sans-serif;
      position: relative;
    }
    .bg-image {
      width: 1200px;
      height: 800px;
      object-fit: cover;
      display: block;
    }
    .branding-overlay {
      position: absolute;
      bottom: 60px;
      left: 60px;
      background: rgba(5, 13, 26, 0.92);
      border: 3px solid #d4a853;
      border-radius: 20px;
      padding: 24px 36px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.3);
      backdrop-filter: blur(12px);
    }
    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 14px;
      object-fit: contain;
    }
    .branding-text {
      display: flex;
      flex-direction: column;
    }
    .company-name {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #b8922e 0%, #d4a853 40%, #f0d78c 70%, #b8922e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .company-service {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 3px;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .company-tagline {
      font-size: 13px;
      font-weight: 600;
      color: #f0d78c;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .top-badge {
      position: absolute;
      top: 40px;
      right: 40px;
      background: rgba(5, 13, 26, 0.92);
      border: 2px solid #d4a853;
      border-radius: 14px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .top-badge img {
      width: 50px;
      height: 50px;
    }
    .top-badge-text {
      color: #d4a853;
      font-size: 16px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <img src="/images/car-transporter-2.jpg" class="bg-image" alt="Real Car Transporter Truck Loading Cars">

  <div class="branding-overlay">
    <img src="/images/logo.png" class="logo-img" alt="Logo">
    <div class="branding-text">
      <div class="company-name">Shebo Cargo &amp; Logistics</div>
      <div class="company-service">Car Shipping &amp; Vehicle Transporter</div>
      <div class="company-tagline">Worldwide &amp; GCC Auto Transport Fleet</div>
    </div>
  </div>

  <div class="top-badge">
    <img src="/images/logo.png" alt="Logo">
    <div class="top-badge-text">Shebo Cargo<br><span style="color:#fff; font-size:12px; font-weight:600;">Car Shipping</span></div>
  </div>
</body>
</html>
